<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu carrito — Lanela Shop</title>
<script src="cart.js" defer></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF; --ivory:#FCFAF7; --beige:#D8B8C3; --gray:#FCFAF7;
    --black:#373330; --rose:#F7ECEF; --burgundy:#D8B8C3; --price:#8B6F63;
    --crema:#F5F0EA; --taupe:#AE9D8D; --mocha:#8B6F63; --terracota:#B77B6C;
  }
  html{ scroll-behavior:smooth; }
  body{ background:var(--ivory); color:var(--black); font-family:'Inter',sans-serif; }
  .display{ font-family:'Playfair Display', serif; }
  .btn-dark{ background:var(--mocha); color:#fff; transition:transform .2s ease, background .2s ease; }
  .btn-dark:hover{ transform:translateY(-2px); background:var(--taupe); }
  .btn-dark:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
  .btn-outline{ border:1px solid var(--burgundy); color:var(--mocha); transition:background .2s ease, color .2s ease; }
  .btn-outline:hover{ background:var(--burgundy); color:var(--black); }
  input:focus, textarea:focus, button:focus-visible, a:focus-visible{ outline:2px solid var(--mocha); outline-offset:2px; }
</style>
</head>
<body class="antialiased">

<header class="sticky top-0 z-50 bg-[var(--ivory)]/95 backdrop-blur border-b border-black/5">
  <div class="max-w-4xl mx-auto px-6 h-20 flex items-center justify-between">
    <a href="index.html"><img src="images/logo.png" alt="Lanela Shop" class="h-8 w-auto"></a>
    <a href="index.html#coleccion" class="btn-outline rounded-full px-5 py-2 text-xs uppercase tracking-wide">Seguir comprando</a>
  </div>
</header>

<main class="max-w-3xl mx-auto px-6 py-12">
  <h1 class="display text-3xl mb-8">Tu carrito</h1>

  <div id="cart-items" class="space-y-6 mb-10"></div>

  <div id="empty-state" class="hidden text-center py-16">
    <p class="text-black/60 mb-6">Tu carrito está vacío.</p>
    <a href="index.html#coleccion" class="btn-dark rounded-full px-8 py-3.5 text-sm uppercase tracking-wide inline-block">Ver colección</a>
  </div>

  <div id="cart-summary" class="border-t border-black/10 pt-6">
    <div class="flex justify-between items-center mb-6">
      <p class="text-lg">Subtotal</p>
      <p id="cart-total" class="display text-2xl price"></p>
    </div>
    <a id="checkout-btn" href="checkout.html" class="btn-dark rounded-full px-8 py-3.5 text-sm uppercase tracking-wide w-full text-center block">Continuar con el pedido</a>
    <p class="text-xs text-black/45 mt-3 text-center">Envíos a todo Colombia · Pago seguro o contraentrega en Bogotá</p>
  </div>
</main>

<footer class="px-6 py-10 bg-[var(--crema)] border-t border-black/5 text-center text-xs text-black/50">
  <p>© 2026 Lanela Shop. Todos los derechos reservados.</p>
</footer>

<script>
function renderCart(){
  const cart = getCart();
  const wrap = document.getElementById('cart-items');
  const empty = document.getElementById('empty-state');
  const summary = document.getElementById('cart-summary');

  if (cart.length === 0){
    wrap.innerHTML = '';
    empty.classList.remove('hidden');
    summary.classList.add('hidden');
    return;
  }
  empty.classList.add('hidden');
  summary.classList.remove('hidden');

  wrap.innerHTML = cart.map((item, i) => `
    <div class="flex gap-4 items-center border-b border-black/5 pb-6">
      <img src="${item.img}" class="w-20 h-24 object-cover rounded-lg bg-[var(--gray)]">
      <div class="flex-1">
        <p class="font-medium text-sm">${item.name}</p>
        <p class="text-xs text-black/55 mb-2">${item.color} · Talla ${item.size}</p>
        <p class="price text-sm font-medium">${formatCOP(item.price)}</p>
      </div>
      <div class="flex items-center gap-2">
        <button class="qty-btn w-7 h-7 rounded-full border border-black/20 text-sm" data-i="${i}" data-op="-">−</button>
        <span class="text-sm w-5 text-center">${item.qty}</span>
        <button class="qty-btn w-7 h-7 rounded-full border border-black/20 text-sm" data-i="${i}" data-op="+">+</button>
      </div>
      <button class="remove-btn text-xs text-[var(--terracota)] hover:underline ml-2" data-i="${i}">Eliminar</button>
    </div>
  `).join('');

  document.getElementById('cart-total').textContent = formatCOP(getCartTotal());

  wrap.querySelectorAll('.qty-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.i, 10);
      const cart = getCart();
      const delta = btn.dataset.op === '+' ? 1 : -1;
      updateQty(i, cart[i].qty + delta);
      renderCart();
    });
  });
  wrap.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      removeFromCart(parseInt(btn.dataset.i, 10));
      renderCart();
    });
  });
}

document.addEventListener('DOMContentLoaded', renderCart);
</script>

</body>
</html>
