<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias por tu compra — Lanela Shop</title>
<script src="cart.js" defer></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF; --ivory:#FCFAF7; --beige:#D8B8C3;
    --black:#373330; --rose:#F7ECEF; --crema:#F5F0EA; --taupe:#AE9D8D; --mocha:#8B6F63;
  }
  body{ background:var(--ivory); color:var(--black); font-family:'Inter',sans-serif; }
  .display{ font-family:'Playfair Display', serif; }
  .btn-dark{ background:var(--mocha); color:#fff; }
  .btn-dark:hover{ background:var(--taupe); }
</style>
</head>
<body class="antialiased">

<header class="sticky top-0 z-50 bg-[var(--ivory)]/95 backdrop-blur border-b border-black/5">
  <div class="max-w-4xl mx-auto px-6 h-20 flex items-center justify-between">
    <a href="index.html"><img src="images/logo.png" alt="Lanela Shop" class="h-8 w-auto"></a>
  </div>
</header>

<main class="max-w-lg mx-auto px-6 py-24 text-center">
  <div class="w-16 h-16 rounded-full bg-[var(--rose)] flex items-center justify-center mx-auto mb-6">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--mocha)" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
  </div>
  <h1 class="display text-3xl mb-3">¡Gracias por tu pedido!</h1>
  <p id="msg" class="text-black/65 mb-2">Ya recibimos la información de tu compra.</p>
  <p id="txn" class="text-xs text-black/45 mb-8"></p>
  <p class="text-sm text-black/60 mb-10">Si tienes alguna duda sobre tu pedido, escríbenos por WhatsApp y con gusto te ayudamos.</p>
  <div class="flex flex-col sm:flex-row gap-3 justify-center">
    <a href="index.html#coleccion" class="btn-dark rounded-full px-8 py-3.5 text-sm uppercase tracking-wide">Seguir comprando</a>
    <a href="https://wa.me/573123634109" class="rounded-full px-8 py-3.5 text-sm uppercase tracking-wide border border-[var(--mocha)] text-[var(--mocha)]">Escribir por WhatsApp</a>
  </div>
</main>

<footer class="px-6 py-10 bg-[var(--crema)] border-t border-black/5 text-center text-xs text-black/50">
  <p>© 2026 Lanela Shop. Todos los derechos reservados.</p>
</footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const txnId = params.get('id');
  if (txnId){
    document.getElementById('msg').textContent = 'Estamos confirmando tu pago con Wompi.';
    document.getElementById('txn').textContent = 'ID de transacción: ' + txnId;
  }
  // Si el pago fue por Wompi, el carrito se limpia aquí (tras la redirección de pago)
  clearCart();
});
</script>

</body>
</html>
