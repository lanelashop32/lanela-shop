<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producto — Lanela Shop</title>
<script src="cart.js" defer></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF; --ivory:#FCFAF7; --beige:#D8B8C3; --gray:#FCFAF7;
    --black:#373330; --rose:#F7ECEF; --burgundy:#D8B8C3; --price:#8B6F63;
    --crema:#F5F0EA; --taupe:#AE9D8D; --mocha:#8B6F63; --terracota:#B77B6C;
  }
  html{ scroll-behavior:smooth; }
  body{ background:var(--ivory); color:var(--black); font-family:'Inter',sans-serif; }
  .display{ font-family:'Playfair Display', serif; }
  .btn-dark{ background:var(--mocha); color:#fff; transition:transform .2s ease, background .2s ease; }
  .btn-dark:hover{ transform:translateY(-2px); background:var(--taupe); }
  .btn-outline{ border:1px solid var(--burgundy); color:var(--mocha); transition:background .2s ease, color .2s ease; }
  .btn-outline:hover{ background:var(--burgundy); color:var(--black); }
  .price{ color:var(--price); }
  .swatch{ width:22px; height:22px; border-radius:9999px; border:1px solid rgba(0,0,0,.15); cursor:pointer; }
  .swatch.active{ outline:2px solid var(--mocha); outline-offset:2px; }
  .thumb{ border:1px solid transparent; cursor:pointer; }
  .thumb.active{ border-color:var(--mocha); }
  input:focus, textarea:focus, button:focus-visible, a:focus-visible{ outline:2px solid var(--mocha); outline-offset:2px; }
  ::-webkit-scrollbar{ width:8px; } ::-webkit-scrollbar-thumb{ background:var(--beige); border-radius:9999px; }
</style>
</head>
<body class="antialiased">

<div class="max-w-6xl mx-auto px-6 pt-6 text-xs text-black/50">

  <p>© 2026 Lanela Shop. Todos los derechos reservados.</p>
</footer>

a-2.jpg", "desc": "Body en polilicra doble tela, ajuste ceñido. Talla LXL."}, {"id": "body-andrea", "name": "Body Andrea", "price": "50.000", "cat": "Bodys", "colors": [{"name": "Beige", "hex": "#E9E2D8", "img": "images/body-andrea-beige.jpg"}, {"name": "Rosado", "hex": "#E7A9BC", "img": "images/body-andrea-rosado.jpg"}, {"name": "Blanco", "hex": "#FFFFFF", "img": "images/body-andrea-blanco.jpg"}], "img1": "images/body-andrea-beige.jpg", "img2": "images/body-andrea-2.jpg", "desc": "Body en polilicra doble tela, ajuste ceñido. Talla ML."}];

const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const product = PRODUCTS.find(p => p.id === id) || PRODUCTS[0];

document.title = product.name + ' — Lanela Shop';
document.getElementById('crumb-name').textContent = product.name;

let selectedColor = product.colors[0].name;
let selectedSize = 'SM';
let currentImg = product.img1;

function render(){
  const root = document.getElementById('product-root');
  root.innerHTML = `
    <div>
      <div class="aspect-[3/4] rounded-xl overflow-hidden bg-[var(--gray)] mb-3 shadow-[0_8px_28px_-14px_rgba(139,111,99,.35)]">
        <img id="main-img" src="${currentImg}" class="w-full h-full object-cover">
      </div>
      <div id="thumb-row" class="flex gap-2 flex-wrap"></div>
    </div>
    <div>
      <p class="uppercase tracking-[0.2em] text-xs text-[var(--mocha)] mb-3">${product.cat}</p>
      <h1 class="display text-4xl mb-3">${product.name}</h1>
      <p class="price text-2xl font-medium mb-6">$ ${product.price}</p>
      <p class="text-sm text-black/65 mb-6 leading-relaxed">${product.desc}</p>

      <p class="text-sm font-medium mb-2">Color: <span id="color-label">${selectedColor}</span></p>
      <div id="color-swatches" class="flex items-center gap-2 flex-wrap mb-6"></div>

      <p class="text-sm font-medium mb-2">Talla</p>
      <div id="size-buttons" class="flex gap-2 mb-8"></div>

      <div class="flex flex-col sm:flex-row gap-3 mb-4">
        <button id="add-cart-btn" class="btn-dark rounded-full px-8 py-3.5 text-sm uppercase tracking-wide">Agregar al carrito</button>
        <a id="whatsapp-btn" class="btn-outline rounded-full px-8 py-3.5 text-sm uppercase tracking-wide text-center" target="_blank" rel="noopener">Pedir por WhatsApp</a>
      </div>
      <p id="add-status" class="text-xs text-[var(--mocha)] hidden">Agregado al carrito ✓</p>
    </div>
  `;

  function selectColor(c){
    selectedColor = c.name;
    document.getElementById('color-label').textContent = c.name;
    document.getElementById('main-img').src = c.img;
    document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.name === c.name));
    document.querySelectorAll('.thumb').forEach(t => t.classList.toggle('active', t.dataset.name === c.name));
    updateWhatsapp();
  }

  // swatches
  const swatchWrap = document.getElementById('color-swatches');
  product.colors.forEach((c, i) => {
    const el = document.createElement('span');
    el.className = 'swatch' + (i === 0 ? ' active' : '');
    el.style.background = c.hex;
    el.title = c.name;
    el.dataset.name = c.name;
    el.addEventListener('click', () => selectColor(c));
    swatchWrap.appendChild(el);
  });

  // miniaturas: una foto real por cada color
  const thumbRow = document.getElementById('thumb-row');
  product.colors.forEach((c, i) => {
    const t = document.createElement('img');
    t.src = c.img;
    t.dataset.name = c.name;
    t.title = c.name;
    t.className = 'thumb' + (i === 0 ? ' active' : '') + ' w-16 h-20 object-cover rounded-lg';
    t.addEventListener('click', () => selectColor(c));
    thumbRow.appendChild(t);
  });

  // sizes
  const sizeWrap = document.getElementById('size-buttons');
  ['SM','LXL'].forEach((s, i) => {
    const btn = document.createElement('button');
    btn.textContent = s;
    btn.className = 'rounded-full px-5 py-2 text-xs uppercase border ' + (i === 0 ? 'btn-dark border-transparent' : 'btn-outline');
    btn.addEventListener('click', () => {
      selectedSize = s;
      sizeWrap.querySelectorAll('button').forEach(b => b.className = 'rounded-full px-5 py-2 text-xs uppercase border btn-outline');
      btn.className = 'rounded-full px-5 py-2 text-xs uppercase border btn-dark border-transparent';
      updateWhatsapp();
    });
    sizeWrap.appendChild(btn);
  });

  // add to cart (real)
  document.getElementById('add-cart-btn').addEventListener('click', () => {
    const selectedImg = product.colors.find(c => c.name === selectedColor)?.img || product.img1;
    addToCart({
      id: product.id,
      name: product.name,
      price: parseInt(product.price.replace(/\./g, ''), 10),
      color: selectedColor,
      size: selectedSize,
      img: selectedImg
    });
    const status = document.getElementById('add-status');
    status.textContent = `Agregado: ${product.name} · ${selectedColor} · ${selectedSize}`;
    status.classList.remove('hidden');
  });

  updateWhatsapp();
}

function updateWhatsapp(){
  const msg = encodeURIComponent(`Hola, quiero pedir ${product.name} en color ${selectedColor}, talla ${selectedSize}.`);
  document.getElementById('whatsapp-btn').href = `https://wa.me/573123634109?text=${msg}`;
}

render();
</script>

</body>
